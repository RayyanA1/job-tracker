services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_local
      POSTGRES_DB: tracker
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - tracker_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker -d tracker']
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      DATABASE_URL: postgres://tracker:tracker_local@db:5432/tracker
      NODE_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_POSTING_MODEL: ${GEMINI_POSTING_MODEL:-}
      CV_PROFILE_DIR: /app/.cv-data
      CV_PDF_DIR: /cv-pdfs
    volumes:
      - ./.cv-data:/app/.cv-data
      - cv_pdfs:/cv-pdfs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  tracker_data:
  cv_pdfs:
